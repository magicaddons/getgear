name: Publish verified GetGear beta
run-name: Verify ${{ inputs.tag }} (publish=${{ inputs.publish }})

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing beta tag (vX.Y.Z-betaN)
        required: true
        type: string
      expected_commit:
        description: Expected full 40-character source commit SHA
        required: true
        type: string
      expected_sha256:
        description: Approved installable ZIP SHA-256 (64 lowercase hex characters)
        required: true
        type: string
      publish:
        description: Upload verified assets and publish the existing draft as a pre-release
        required: true
        default: false
        type: boolean

permissions: {}
concurrency:
  group: getgear-beta-release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout trusted release infrastructure
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: infrastructure
          persist-credentials: false
      - name: Test release safeguards offline
        run: python3 -m unittest discover -s infrastructure/tests/release -v
      - name: Validate inputs
        env:
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ inputs.expected_commit }}
          CHECKSUM: ${{ inputs.expected_sha256 }}
        run: |
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, 'infrastructure/tools/release')
          from package import identity
          identity(os.environ['TAG'], os.environ['COMMIT'], os.environ['CHECKSUM'])
          PY
      - name: Checkout selected exact source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.expected_commit }}
          path: source
          persist-credentials: false
      - name: Verify remote tag (read only)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ inputs.expected_commit }}
        run: |
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, 'infrastructure/tools/release')
          from publish import GitHub, verify_tag
          verify_tag(GitHub(os.environ['GITHUB_REPOSITORY']), os.environ['TAG'], os.environ['COMMIT'])
          PY
      - name: Install Lua compatibility tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1 lua5.4
      - name: Build and validate exact package and packaged regressions
        env:
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ inputs.expected_commit }}
          CHECKSUM: ${{ inputs.expected_sha256 }}
        run: |
          python3 infrastructure/tools/release/package.py source dist "$TAG" "$COMMIT" "$CHECKSUM" \
            "infrastructure/release-packages/GetGear-$TAG.zip"
      - name: Check source generator regressions without credentials
        working-directory: source
        run: |
          set -euo pipefail
          for test in tests/*.py; do
            [ -f "$test" ] || continue
            python3 "$test"
          done
          git diff --exit-code
      - name: Preserve verified package for this run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-beta-package
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  inspect:
    if: ${{ github.ref == 'refs/heads/main' && !inputs.publish }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # GitHub hides unpublished drafts from contents: read tokens. The helper
      # enforces GET-only access in this job despite the required visibility grant.
      contents: write
    steps:
      - name: Checkout trusted inspection helper only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: tools/release
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-beta-package
          path: dist
      - name: Inspect existing assets without changing the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ inputs.expected_commit }}
          CHECKSUM: ${{ inputs.expected_sha256 }}
        run: python3 tools/release/publish.py dist "$TAG" "$COMMIT" "$CHECKSUM" false

  publish:
    if: ${{ github.ref == 'refs/heads/main' && inputs.publish }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout trusted publishing helper only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: tools/release
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-beta-package
          path: dist
      - name: Upload, download-verify, then publish existing draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ inputs.expected_commit }}
          CHECKSUM: ${{ inputs.expected_sha256 }}
        run: python3 tools/release/publish.py dist "$TAG" "$COMMIT" "$CHECKSUM" true
