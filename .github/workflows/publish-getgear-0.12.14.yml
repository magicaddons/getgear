name: Publish GetGear v0.12.14 beta

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-getgear-0.12.14.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated source
        uses: actions/checkout@v4
      - name: Install Lua 5.4
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
      - name: Verify source and package
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^## Version: 0.12.14$' GetGear.toc
          test "$(grep -c '^CraftingVisibility.lua$' GetGear.toc)" -eq 1
          test "$(grep -c '^GearCompare.lua$' GetGear.toc)" -eq 1
          test -f RELEASE_v0.12.14.md
          lua_count="$(grep -c '.lua$' GetGear.toc)"
          test "$lua_count" -eq 35
          test "$(find . -maxdepth 1 -type f -name '*.lua' | wc -l)" -eq "$lua_count"
          lua5.4 tests/early-crafts-regression.lua .
          lua5.4 tests/item-data-regression.lua .
          lua5.4 tests/comparison-cleanup.lua .
          lua5.4 tests/craftability-filter.lua .
          mkdir -p dist/GetGear
          cp ./*.lua GetGear.toc README.txt MapPin.tga DATA_MODEL.md dist/GetGear/
          test "$(find dist/GetGear -maxdepth 1 -type f | wc -l)" -eq "$((lua_count + 4))"
          (cd dist && zip -q -r '../GetGear-v0.12.14-private-test-beta.zip' GetGear)
          unzip -t GetGear-v0.12.14-private-test-beta.zip
          unzip -p GetGear-v0.12.14-private-test-beta.zip GetGear/GetGear.toc | grep -q '^## Version: 0.12.14$'
          unzip -p GetGear-v0.12.14-private-test-beta.zip GetGear/CraftingVisibility.lua | grep -q 'ShouldDisplayCraftedGear'
      - name: Publish beta release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view v0.12.14 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release v0.12.14 already exists; not replacing.' >&2
            exit 1
          fi
          gh release create v0.12.14 GetGear-v0.12.14-private-test-beta.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title 'GetGear v0.12.14 Beta' \
            --notes-file RELEASE_v0.12.14.md \
            --prerelease \
            --target "$GITHUB_SHA"
