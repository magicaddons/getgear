name: Historical source export (quarantined)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Reject retired mixed-provenance exporter
        shell: bash
        run: |
          echo "This historical exporter is quarantined by docs/RESEARCH_SOURCE_POLICY.json."
          echo "Use guarded research tools with individually reviewed provenance."
          echo "The original exporter remains in Git history; no evidence is downloaded or promoted."
          exit 1
