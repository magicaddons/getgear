name: Beta4 school-specific stat audit (temporary)
on:
  pull_request:
    paths:
      - ".github/workflows/beta4-school-audit.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact Forever tooltip spell-school bonuses
        run: |
          python3 - <<'PY'
          import urllib.request, json, html, re, hashlib
          url='https://raw.githubusercontent.com/Napalmsteak/WoW-Classic-Item-Caches/main/Forever%20Cache.json'
          raw=urllib.request.urlopen(url,timeout=75).read()
          assert hashlib.sha256(raw).hexdigest()=='5d9a6461d2a7adbc4e3d765f19fbeb6adb37c4c53161bb89e4d7b770f805ca32'
          source=json.loads(raw)
          for school in ('Frost','Arcane','Fire'):
              found=[]
              for item in source:
                  if item.get('itemExpansion')!='Forever':continue
                  markup=item.get('tooltipHtml') or ''
                  text=re.sub(r'\s+',' ',html.unescape(re.sub(r'<[^>]*>',' ',markup)))
                  patterns=[
                      rf'\+\s*\d+\s+{school}\s+(?:Spell\s+)?Damage\b',
                      rf'\b{school}\b.{0,55}\b(?:spell )?damage\b',
                      rf'\bdamage\b.{0,55}\b{school}\b',
                      rf'\b{school}\b.{0,55}\bspells\b'
                  ]
                  if any(re.search(p,text,re.I) for p in patterns):
                      # Display a targeted window, never huge tooltip dumps.
                      match=re.search(rf'\b{school}\b',text,re.I)
                      excerpt=text[max(0,match.start()-70):match.start()+170]
                      found.append((item.get('itemId'),item.get('name'),excerpt))
              print(school,'possible-specific-candidates',len(found))
              for row in found[:42]:print('  ',row)
          PY
