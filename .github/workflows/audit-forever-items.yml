name: Audit staged Forever equipment against item API
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Level60GearPhase1.lua"
      - "tools/audit_level60_items.py"
      - ".github/workflows/audit-forever-items.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check staged 31–60 item IDs, names, and equip levels
        run: python3 tools/audit_level60_items.py --strict
