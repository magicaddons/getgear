name: Stage broad Forever 1-60 item cache (unpublished)
on:
  pull_request:
    paths:
      - "tools/build_forever_catalog.py"
      - ".github/workflows/stage-forever-catalog.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate source-caveated Forever 1-60 data
        run: |
          mkdir -p dist
          python3 tools/build_forever_catalog.py --output dist/GeneratedForeverGear.lua --report dist/forever-audit.json
          python3 - <<'PY'
          import json,pathlib
          report=json.loads(pathlib.Path('dist/forever-audit.json').read_text())
          assert report['upstreamItems']>=10000
          assert report['importableItems']>=1000
          assert report['importableItems']<=10000
          assert report['sourceLastRefresh'].startswith('2026-10')
          print('PASS: staging cache has',report['importableItems'],'class-eligible items')
          PY
      - name: Syntax-check generated Lua
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          luac5.4 -p dist/GeneratedForeverGear.lua
      - name: Validate broad catalogue against the addon in isolation
        shell: bash
        run: |
          mkdir -p dist/standalone
          cp ./*.lua GetGear.toc dist/standalone/
          cp dist/GeneratedForeverGear.lua dist/standalone/
          if ! grep -q '^GeneratedForeverGear.lua
          lua5.4 tests/generated-cache-smoke.lua dist/standalone
      - name: Save validated candidate to the same development PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'work/gear-1-60-expansion'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "getgear-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin work/gear-1-60-expansion
          git checkout -B work/gear-1-60-expansion origin/work/gear-1-60-expansion
          cp dist/GeneratedForeverGear.lua ./GeneratedForeverGear.lua
          mkdir -p docs
          cp dist/forever-audit.json docs/generated-forever-audit.json
          git add GeneratedForeverGear.lua docs/generated-forever-audit.json
          if git diff --cached --quiet; then
            echo "No source changes in generated catalogue"
          else
            git commit -m "Stage source-caveated Forever 1-60 equipment cache (not active yet)"
            git push origin HEAD:work/gear-1-60-expansion
          fi
      - name: Keep candidate only as development artifact, never publish release
        uses: actions/upload-artifact@v4
        with:
          name: GetGear-Forever-cache-staging-only
          path: |
            dist/GeneratedForeverGear.lua
            dist/forever-audit.json
          retention-days: 14
 dist/standalone/GetGear.toc; then
            sed -i '/^Level60GearPhase1.lua$/a GeneratedForeverGear.lua' dist/standalone/GetGear.toc
          fi
          lua5.4 tests/generated-cache-smoke.lua dist/standalone
      - name: Save validated candidate to the same development PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'work/gear-1-60-expansion'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "getgear-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin work/gear-1-60-expansion
          git checkout -B work/gear-1-60-expansion origin/work/gear-1-60-expansion
          cp dist/GeneratedForeverGear.lua ./GeneratedForeverGear.lua
          mkdir -p docs
          cp dist/forever-audit.json docs/generated-forever-audit.json
          git add GeneratedForeverGear.lua docs/generated-forever-audit.json
          if git diff --cached --quiet; then
            echo "No source changes in generated catalogue"
          else
            git commit -m "Stage source-caveated Forever 1-60 equipment cache (not active yet)"
            git push origin HEAD:work/gear-1-60-expansion
          fi
      - name: Keep candidate only as development artifact, never publish release
        uses: actions/upload-artifact@v4
        with:
          name: GetGear-Forever-cache-staging-only
          path: |
            dist/GeneratedForeverGear.lua
            dist/forever-audit.json
          retention-days: 14
