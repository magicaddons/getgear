name: Refresh beta2 mana-role cache (temporary)
on:
  pull_request:
    paths:
      - '.github/workflows/stage-forever-catalog.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild source-caveated data into an unpublished artifact
        run: |
          mkdir -p dist
          python3 tools/build_forever_catalog.py --output dist/GeneratedForeverGear.lua --report dist/forever-audit.json
          python3 - <<'PY'
          import json,pathlib
          report=json.loads(pathlib.Path('dist/forever-audit.json').read_text())
          assert 1000 <= report['importableItems'] <= 10000
          print('PASS:',report['importableItems'],'cache candidates; not a live-server verification')
          PY
      - name: Syntax check and isolated class-coverage stress test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          luac5.4 -p dist/GeneratedForeverGear.lua
          mkdir -p dist/standalone
          cp ./*.lua GetGear.toc dist/standalone/
          cp dist/GeneratedForeverGear.lua dist/standalone/
          if ! grep -q '^GeneratedForeverGear.lua$' dist/standalone/GetGear.toc; then
            sed -i '/^Level60GearPhase1.lua$/a GeneratedForeverGear.lua' dist/standalone/GetGear.toc
          fi
          lua5.4 tests/generated-cache-smoke.lua dist/standalone
      - name: Save updated mana-role cache in development branch
        if: github.event_name == 'pull_request' && github.head_ref == 'work/gear-1-60-expansion' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "getgear-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin work/gear-1-60-expansion
          git checkout -B work/gear-1-60-expansion origin/work/gear-1-60-expansion
          cp dist/GeneratedForeverGear.lua ./GeneratedForeverGear.lua
          mkdir -p docs
          cp dist/forever-audit.json docs/generated-forever-audit.json
          git add GeneratedForeverGear.lua docs/generated-forever-audit.json
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate Forever equipment with distinct mana-role tags"
            git push origin HEAD:work/gear-1-60-expansion
          fi
      - name: Keep development-only audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: GetGear-Forever-cache-staging-only
          path: |
            dist/GeneratedForeverGear.lua
            dist/forever-audit.json
          retention-days: 14
