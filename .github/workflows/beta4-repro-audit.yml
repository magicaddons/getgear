name: Beta4 canonical research reproducibility audit
on:
  pull_request:
    paths:
      - ".github/workflows/beta4-repro-audit.yml"
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Beta4 sources
        uses: actions/checkout@v4
        with:
          path: beta4
      - name: Checkout the frozen pre-migration Beta3 source
        uses: actions/checkout@v4
        with:
          ref: ae63ea80929c5a7cc1ba211524bece46542efb36
          path: beta3
      - name: Install Lua
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
      - name: Rebuild all canonical item facts from legacy effective sources
        shell: bash
        run: |
          set -euo pipefail
          lua5.4 beta4/tools/build_beta4_catalogue.lua beta3 reproduced.lua beta4/tools/beta4_schools.tsv
          cmp -s reproduced.lua beta4/ResearchedItemFacts.lua || {
            echo "FAILED: current facts differ from deterministic migration output"
            diff -u beta4/ResearchedItemFacts.lua reproduced.lua | head -n 80 || true
            exit 1
          }
          sha256sum reproduced.lua beta4/ResearchedItemFacts.lua
          echo "PASS: all researched item facts deterministically reproduced from the frozen Beta3 baseline"
