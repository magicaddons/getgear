name: Inspect public source catalogue schema
on:
  push:
    branches: [work/full-acquisition-reconciliation-20261109]
    paths:
      - tools/probe_playfulls_data.py
      - .github/workflows/probe-playfulls.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect public source metadata
        run: python3 tools/probe_playfulls_data.py
