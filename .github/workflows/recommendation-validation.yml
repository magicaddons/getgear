name: Validate bags, source access and stat priorities (no release)
on:
  push:
    branches: [recommendation-sources-stat-priorities, settings-ui-refinement]
    paths:
      - '*.lua'
      - GetGear.toc
      - tests/**
      - tools/**
      - docs/recommendation-audit/bag-quest-evidence.json
      - docs/recommendation-audit/equipment-source-eligibility.csv
      - docs/faction-audit/evidence.json
      - docs/faction-audit/reputation-factions.json
      - docs/faction-audit/catalogue-evidence-audit.csv
      - docs/faction-audit/catalogue-eligibility.csv
      - docs/faction-audit/eligibility-changes.json
      - docs/GLOBAL_FILTERING_POLICY.md
      - AGENTS.md
      - .github/workflows/recommendation-validation.yml
  pull_request:
    paths:
      - '*.lua'
      - GetGear.toc
      - tests/**
      - tools/validate_recommendations.py
      - tools/build_bag_quest_catalogue.py
      - tools/audit_recommendation_sources.lua
      - docs/recommendation-audit/**
      - docs/faction-audit/evidence.json
      - docs/faction-audit/reputation-factions.json
      - docs/faction-audit/catalogue-evidence-audit.csv
      - docs/faction-audit/catalogue-eligibility.csv
      - docs/faction-audit/eligibility-changes.json
      - docs/GLOBAL_FILTERING_POLICY.md
      - AGENTS.md
      - .github/workflows/recommendation-validation.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Lua interpreters without changing the repository
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --location 'https://deb.debian.org/debian/pool/main/l/lua5.4/lua5.4_5.4.7-1+b2_amd64.deb' --output "$RUNNER_TEMP/lua54.deb"
          curl --fail --show-error --location 'https://deb.debian.org/debian/pool/main/l/lua5.1/lua5.1_5.1.5-9_amd64.deb' --output "$RUNNER_TEMP/lua51.deb"
          printf '%s  %s\n' 'da5947f8274bdcd0dd6d1aaf6d780bc7537827455d456d07dc9c14daf702f1df' "$RUNNER_TEMP/lua54.deb" | sha256sum --check -
          printf '%s  %s\n' '2abaa116e03f4aaf34de634b447e7fa11569e27b33de342e93bbcf0857694015' "$RUNNER_TEMP/lua51.deb" | sha256sum --check -
          dpkg-deb --extract "$RUNNER_TEMP/lua54.deb" "$RUNNER_TEMP/lua54"
          dpkg-deb --extract "$RUNNER_TEMP/lua51.deb" "$RUNNER_TEMP/lua51"
          echo "$RUNNER_TEMP/lua54/usr/bin" >> "$GITHUB_PATH"
      - name: Validate acquisition snapshot (fresh reconciliation on source branches)
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == 'refs/heads/settings-ui-refinement' || "${GITHUB_HEAD_REF:-}" == 'settings-ui-refinement' ]]; then
            # Acceptance work retains the approved catalogue. Fresh diagnostics
            # run separately; upstream source drift must not change this gate.
            python3 tools/reconcile_presentation_snapshot.py --verify-only
          else
            python3 tools/reconcile_presentation_snapshot.py --diagnostics "$RUNNER_TEMP/recommendation-reconciliation"
          fi
      - name: Integrated source, comparison, UI and saved-settings regressions
        run: python3 tools/validate_recommendations.py --output "$RUNNER_TEMP/recommendation-validation" --lua51 "$RUNNER_TEMP/lua51/usr/bin/lua5.1" --luac51 "$RUNNER_TEMP/lua51/usr/bin/luac5.1"
      - name: Keep validation receipts (no addon package)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recommendation-validation-receipts
          path: |
            ${{ runner.temp }}/recommendation-validation/
            ${{ runner.temp }}/recommendation-reconciliation/PRESENTATION_SNAPSHOT_RECONCILIATION.json
          retention-days: 30
