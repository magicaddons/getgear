name: Inspect upstream Forever item-cache schema
on:
  pull_request:
    paths:
      - ".github/workflows/inspect-forever-cache.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect cache metadata only (no installable data)
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request,collections,re
          url="https://raw.githubusercontent.com/Napalmsteak/WoW-Classic-Item-Caches/main/Forever%20Cache.json"
          try:
              req=urllib.request.Request(url,headers={"User-Agent":"GetGear source audit/1.0"})
              with urllib.request.urlopen(req,timeout=60) as resp:
                  b=resp.read(30000000)
              print("SIZE",len(b))
              data=json.loads(b)
              print("ITEMS",len(data),"TYPE",type(data).__name__)
              if not isinstance(data,list) or not data: raise ValueError("Unexpected dataset format")
              print("KEYS",list(data[0].keys()))
              print("SOURCE COUNTS",collections.Counter(s for r in data for s in r.get("sourceTypes",[])).most_common(12))
              for id in (3473,3489,14154,7944,10020,2852):
                  r=next((x for x in data if x.get("itemId")==id),None)
                  print("ITEM",id, "name",r.get("name") if r else None,
                        "sources",r.get("sourceLabels") if r else None,
                        "tooltip",re.sub(r"<[^>]+>"," | ",r.get("tooltipHtml",""))[:560] if r else None)
              print("LAST REFRESH",max(str(r.get("lastUpdatedAt","")) for r in data))
          except Exception as e:
              print("SOURCE FETCH UNAVAILABLE",type(e).__name__,str(e)[:500])
              # Investigation only: upstream failure is not a failing addon test.
          PY
