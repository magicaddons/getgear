name: Validate GetGear Data and Login Events

on:
  pull_request:
    paths:
      - "*.lua"
      - "GetGear.toc"
      - "tests/**"
      - ".github/workflows/test-early-crafts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Lua 5.4
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
      - name: Compile each addon module and test crafted progressions
        run: |
          lua5.4 tests/early-crafts-regression.lua .
          lua5.4 tests/item-data-regression.lua .
          lua5.4 tests/comparison-cleanup.lua .
          lua5.4 tests/craftability-filter.lua .
          lua5.4 tests/early-coverage-regression.lua .
          lua5.4 tests/level60-staging-regression.lua .
          lua5.4 tests/full-catalogue-eligibility.lua .
          lua5.4 tests/generated-item-load-guard.lua .
          lua5.4 tests/coverage-audit.lua .
      - name: Package GetGear v0.13.0 Beta 1 (private test candidate)
        if: github.event_name == 'pull_request' && github.head_ref == 'work/gear-1-60-expansion'
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq '## Version: 0.13.0-beta1' GetGear.toc
          test "$(grep -c '^GearCompare.lua$' GetGear.toc)" -eq 1
          test "$(grep -c '^GeneratedForeverGear.lua$' GetGear.toc)" -eq 1
          test "$(grep -c '^EarlyCoverage133.lua$' GetGear.toc)" -eq 1
          toc_count="$(grep -c '.lua$' GetGear.toc)"
          local_count="$(find . -maxdepth 1 -name '*.lua' -type f | wc -l)"
          test "$local_count" -eq "$toc_count"
          test "$toc_count" -ge 38
          while IFS= read -r module; do
            case "$module" in
              *.lua) test -f "$module" ;;
            esac
          done < GetGear.toc
          mkdir -p dist/GetGear
          cp ./*.lua GetGear.toc README.txt BETA_0130_NOTES.txt MapPin.tga DATA_MODEL.md dist/GetGear/
          printf 'GetGear version: 0.13.0-beta1\nDevelopment branch: work/gear-1-60-expansion\nSource commit: %s\nBuild type: test-only GitHub Actions artifact, NOT a public release\n' "$GITHUB_SHA" > dist/GetGear/BUILD_INFO.txt
          test "$(find dist/GetGear -maxdepth 1 -type f | wc -l)" -eq "$((toc_count+6))"
          (cd dist && zip -q -r '../GetGear-v0.13.0-beta1-test-only.zip' GetGear)
          unzip -tq GetGear-v0.13.0-beta1-test-only.zip
          unzip -p GetGear-v0.13.0-beta1-test-only.zip GetGear/GetGear.toc | grep -Fxq '## Version: 0.13.0-beta1'
          unzip -p GetGear-v0.13.0-beta1-test-only.zip GetGear/GeneratedForeverGear.lua | grep -q 'GetGear.GeneratedForeverGear=audit'
          unzip -p GetGear-v0.13.0-beta1-test-only.zip GetGear/EarlyCoverage133.lua | grep -q 'Thick War Axe'
          sha256sum GetGear-v0.13.0-beta1-test-only.zip
          ls -lh GetGear-v0.13.0-beta1-test-only.zip
      - name: Upload GetGear v0.13.0 Beta 1 installable ZIP (test only)
        if: github.event_name == 'pull_request' && github.head_ref == 'work/gear-1-60-expansion'
        uses: actions/upload-artifact@v4
        with:
          name: GetGear-v0.13.0-beta1-test-only
          path: GetGear-v0.13.0-beta1-test-only.zip
          if-no-files-found: error
          retention-days: 30
