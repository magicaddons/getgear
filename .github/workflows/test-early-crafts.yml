name: Validate GetGear Data and Login Events

on:
  pull_request:
    paths:
      - "*.lua"
      - "GetGear.toc"
      - "tests/**"
      - ".github/workflows/test-early-crafts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Lua 5.4
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
      - name: Compile each addon module and test crafted progressions
        run: |
          lua5.4 tests/early-crafts-regression.lua .
          lua5.4 tests/item-data-regression.lua .
          lua5.4 tests/comparison-cleanup.lua .
          lua5.4 tests/craftability-filter.lua .
          lua5.4 tests/level60-staging-regression.lua .
      - name: Package GetGear v0.12.14 beta candidate
        if: github.head_ref == 'fix/clean-comparison-disclaimers'
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^## Version: 0.12.14$' GetGear.toc
          test "$(grep -c '^GearCompare.lua$' GetGear.toc)" -eq 1
          local_count="$(find . -maxdepth 1 -name '*.lua' -type f | wc -l)"
          toc_count="$(grep -c '.lua$' GetGear.toc)"
          test "$local_count" -eq "$toc_count"
          test "$toc_count" -ge 35
          mkdir -p dist/GetGear
          cp ./*.lua GetGear.toc README.txt MapPin.tga DATA_MODEL.md dist/GetGear/
          test "$(find dist/GetGear -maxdepth 1 -type f | wc -l)" -eq "$((toc_count + 4))"
          (cd dist && zip -q -r '../GetGear-v0.12.14-private-test-beta.zip' GetGear)
          unzip -t GetGear-v0.12.14-private-test-beta.zip
          unzip -p GetGear-v0.12.14-private-test-beta.zip GetGear/GetGear.toc | grep -q '^## Version: 0.12.14$'
          unzip -p GetGear-v0.12.14-private-test-beta.zip GetGear/GearCompare.lua | grep -q 'Equipped weapon has higher DPS'
      - name: Upload installable ZIP (build candidate only)
        if: github.head_ref == 'fix/clean-comparison-disclaimers'
        uses: actions/upload-artifact@v4
        with:
          name: GetGear-v0.12.14-private-test-beta
          path: GetGear-v0.12.14-private-test-beta.zip
          if-no-files-found: error
          retention-days: 30
