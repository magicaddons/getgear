name: Export external recipe and source data for GetGear audit
on:
  push:
    branches: [work/gear-data-reconciliation]
    paths: [.github/workflows/getgear-external-recipe-export.yml]
permissions:
  contents: read
jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and inspect public structured recipe datasets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export
          python3 - <<'PY'
          import urllib.request,urllib.error,re,json,os,html
          urls=[
            'https://playautotechnologies.org/open-data',
            'https://playautotechnologies.org/data/forever-recipes.json',
            'https://playautotechnologies.org/open-data/forever-recipes.json',
            'https://playautotechnologies.org/datasets/forever-recipes.json',
            'https://warcraftforever.win/crafting/',
            'https://ahledger.com/data',
            'https://foreverecon.com/recipes',
            'https://wowforevercompass.com/professions/recipes/',
            'https://endgametools.com/en/wow-forever/professions'
          ]
          summaries=[]
          for i,url in enumerate(urls):
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'GetGear-Audit/1.0 (public data compatibility research)'})
              with urllib.request.urlopen(req,timeout=22) as f: body=f.read(12000000);ct=f.headers.get('Content-Type','')
              ext='json' if body[:1] in (b'[',b'{') else 'html'
              with open('export/page%d.%s'%(i,ext),'wb') as f:f.write(body)
              s=body.decode('utf-8','replace')
              links=re.findall(r'''(?:href|src)=["']([^"']+)''',s,re.I)
              nearby=[m.start() for m in re.finditer('forever-recipes|json|api|catalog',s,re.I)]
              snippets=[s[max(0,j-130):j+180] for j in nearby[:30]]
              summaries.append({'url':url,'status':200,'bytes':len(body),'type':ct,'links':links[:200],'snippets':snippets})
            except Exception as e:summaries.append({'url':url,'error':str(e)})
          with open('export/discovery.json','w') as f:json.dump(summaries,f,indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: GetGear-recipe-source-discovery
          path: export/
          retention-days: 14
