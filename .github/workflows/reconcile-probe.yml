name: Inspect source catalogue schemas
on:
  push:
    branches: [work/acquisition-reconciliation-1-60]
    paths: [.github/workflows/reconcile-probe.yml, tools/probe_acquisition_sources.py]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/probe_acquisition_sources.py
